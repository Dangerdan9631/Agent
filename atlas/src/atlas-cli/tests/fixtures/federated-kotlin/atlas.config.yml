schemaVersion: 2
documentType: root

project:
  name: Federated Kotlin
  artifacts:
    root: artifact-root
  diagrams:
    - id: kotlin-example
      title: Kotlin Example
      groups:
        - id: application
          title: Application
          selector:
            moduleTags:
              - application

modules:
  - model: app.atlas.module.yml
    tags:
      - application
    diagrams:
      - id: app
        title: Application
        scope:
          type: module
      - id: app-feature
        title: Application feature
        scope:
          type: path
          path: src/main/kotlin/dev/example/app/feature
    validation:
      rules:
        - id: feature-no-support
          type: forbid
          severity: error
          relationships:
            - references
          from:
            sourcePaths:
              - src/main/kotlin/dev/example/app/feature/**
          to:
            moduleTags:
              - support-tooling

  - model: test-support.atlas.module.yml
    tags:
      - support-tooling

validation:
  rules:
    - id: application-no-support
      type: dependency-direction
      severity: error
      relationships:
        - references
      mode: forbid
      from:
        moduleTags:
          - application
      to:
        moduleTags:
          - support-tooling
    - id: no-cycles
      type: no-circular
      severity: error
      relationships:
        - references
