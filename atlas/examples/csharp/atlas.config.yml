schemaVersion: 2
documentType: root
project:
  name: Atlas C# Reading List
  artifacts:
    root: architecture
  diagrams:
    - id: landscape
      title: C# reading list
modules:
  - model: Lib-net8.0.atlas.module.yml
    tags: [runtime, library]
    diagrams:
      - id: api
        title: Library API
        scope: { type: module }
  - model: App-net8.0.atlas.module.yml
    tags: [runtime, executable]
    diagrams:
      - id: application
        title: Application
        scope: { type: module }
validation:
  rules:
    - id: no-runtime-cycles
      type: no-circular
      severity: error
      relationships: [imports, references, calls]
      within: { moduleTags: [runtime] }
    - id: library-does-not-depend-on-app
      type: dependency-direction
      severity: error
      mode: forbid
      relationships: [imports, references, calls]
      from: { moduleTags: [library] }
      to: { moduleTags: [executable] }
