schemaVersion: 1
discovery:
  packageGlobs:
    - "gems/*"
  defaultSourceRoots:
    - lib
  packages:
    - match:
        name: atlas-example-lib
      classification: runtime
      classes:
        - library
    - match:
        name: atlas-example-app
      classification: runtime
      classes:
        - executable
artifacts:
  root: architecture
diagrams:
  packages:
    - packageName: atlas-example-lib
    - packageName: atlas-example-app
layers:
  - name: library
    sourceGlobs:
      - "**"
    packageNames:
      - atlas-example-lib
  - name: executable
    sourceGlobs:
      - "**"
    packageNames:
      - atlas-example-app
rules:
  - id: no-cycles
    type: no-circular
    severity: error
  - id: library-does-not-depend-on-app
    type: dependency-direction
    severity: error
    mode: forbid
    from:
      layers:
        - library
    to:
      layers:
        - executable
